# Every check this repository's figures rest on, from a clean checkout.
#
# Before this workflow existed, every check was run by hand against a working
# tree with stale build output on disk, and a fresh clone could not build at
# all (see scripts/workspaces.mjs). Running from nothing is the point.

name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build # dependency order; also builds apps/canvas-demo
      - run: npm run typecheck
      - run: npm test # the pricing and integration suites build the WASM once in globalSetup

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --release
        working-directory: crates/pricing-core
      - run: node scripts/verify-wasm-parity.mjs # native vs WASM, bit for bit

  browser:
    runs-on: ubuntu-latest
    # shared-shots keeps its canvas in Postgres through services/collab.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COLLAB_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-go@v5 # live-shots and models-shots build and run the Go services
        with:
          go-version-file: services/dataplane/go.mod
          cache-dependency-path: |
            services/dataplane/go.sum
            services/gateway/go.sum
      - run: npm run build
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: crates/pricing-core
      - name: Demo surfaces in headless Chromium
        run: |
          for check in screenshot ink-shots inkgl-shots gl-shots collab-shots payoff-shots rates-shots tools-shots live-shots models-shots shared-shots signin-shots csp-check; do
            echo "::group::$check"
            node "apps/canvas-demo/scripts/$check.mjs"
            echo "::endgroup::"
          done

  # The Go data plane, against a real Postgres. DATAPLANE_REQUIRE_PG turns the
  # tests that would skip without a database into failures, so this job cannot
  # pass by not running them. The conformance file it reads is the one the
  # typescript job regenerates and compares; both must agree with it.
  dataplane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATAPLANE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATAPLANE_REQUIRE_PG: '1'
    defaults:
      run:
        working-directory: services/dataplane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/dataplane/go.mod
          cache-dependency-path: services/dataplane/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      # Phase 1's exit criterion through the service: the historical morning
      # loaded into Postgres over HTTP and read back by canvas-data's client.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build --workspace @picasso/canvas-core --workspace @picasso/canvas-data --workspace @picasso/canvas-sim
        working-directory: .
      - run: node scripts/historical-morning-remote.mjs
        working-directory: .
      # picasso-collab against the same Postgres: its tests skip without one,
      # and COLLAB_REQUIRE_PG makes that a failure here.
      - run: npm test --workspace @picasso/collab
        working-directory: .
        env:
          COLLAB_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          COLLAB_REQUIRE_PG: '1'

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # The audit and identity packages are copies of the data plane's, and the
      # data plane's job runs the audit store against Postgres; they must match.
      - name: shared packages match the data plane's
        run: diff -r ../dataplane/audit audit && diff -r ../dataplane/identity identity
      - run: go vet ./...
      - run: go test -race ./...
