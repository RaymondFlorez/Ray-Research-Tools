name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm -r build

      - name: Bundle size budget
        run: pnpm --filter @geoglobe/web size

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API (dev extras)
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Test API
        working-directory: apps/api
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        working-directory: apps/web
        run: pnpm test:e2e

  # Build all three images and run the production compose stack end to end (demo LLM,
  # so no Anthropic key is needed): migrations, seed, API, nginx proxy, agent WebSocket.
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env (generated secrets, demo LLM)
        run: |
          sed -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^GEOGLOBE_JWT_SECRET=$/GEOGLOBE_JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^GEOGLOBE_AGENT_LLM=anthropic/GEOGLOBE_AGENT_LLM=demo/" \
              .env.example > .env

      - name: Build and smoke test the production stack
        run: ./scripts/smoke-test.sh --down

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install kustomize + kubeconform
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Render and validate
        run: |
          cp infra/k8s/secrets.env.example infra/k8s/secrets.env
          kustomize build infra/k8s | kubeconform -strict -summary -kubernetes-version 1.30.0
