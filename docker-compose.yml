# GeoGlobe local dev stack.
#
# `docker compose up` brings up PostGIS + Redis + the FastAPI Data Service.
# Then seed the sample data:
#   docker compose exec api python -m geoglobe_api.seed
# The web app (apps/web) runs separately via `pnpm --filter @geoglobe/web dev`.

services:
  db:
    # PostGIS + pgvector (see infra/db/Dockerfile).
    build: ./infra/db
    environment:
      POSTGRES_USER: geoglobe
      POSTGRES_PASSWORD: geoglobe
      POSTGRES_DB: geoglobe
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Migrations in infra/db/init run automatically on first init, in filename order.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geoglobe']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: ./apps/api
    environment:
      GEOGLOBE_DATABASE_URL: postgresql+psycopg://geoglobe:geoglobe@db:5432/geoglobe
      GEOGLOBE_CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
