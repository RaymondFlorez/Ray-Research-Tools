[project]
name = "geoglobe-api"
version = "0.1.0"
description = "GeoGlobe backend: Data Service + LLM agent orchestration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
agent = ["anthropic>=0.40", "mcp>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoglobe_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
