<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picasso StrategyNode</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6f5f2; color: #1c1a17;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #wrap { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
      #surface { display: block; width: 100%; height: 100%; }
      #panel { border-left: 1px solid #c9c6bf; padding: 16px; background: #fbfaf8;
        display: flex; flex-direction: column; gap: 14px; }
      h1 { font-size: 13px; margin: 0; letter-spacing: 0.02em; }
      #hud { white-space: pre; font-size: 11px; line-height: 1.7; color: #3a362f; }
      #badge { font-size: 11px; padding: 6px 8px; border-radius: 4px;
        border: 1px solid #c9c6bf; background: #fff; }
      #badge[data-outcome="escalated"] { border-color: #b08234; background: #fdf6e7; }
      #badge[data-outcome="passed"] { border-color: #6a8f5f; background: #f1f7ef; }
      label { display: block; font-size: 11px; color: #6f6a61; margin-bottom: 4px; }
      select, input { width: 100%; font: inherit; }
      p { margin: 0; font-size: 11px; color: #6f6a61; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@picasso/canvas-core": "/packages/canvas-core/dist/index.js",
          "@picasso/canvas-pricing": "/packages/canvas-pricing/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="wrap">
      <canvas id="surface"></canvas>
      <div id="panel">
        <h1>StrategyNode — P&amp;L surface</h1>
        <div>
          <label for="strategy">book</label>
          <select id="strategy"></select>
        </div>
        <div>
          <label for="decay">days of decay</label>
          <input id="decay" type="range" min="0" max="60" step="1" value="0" />
        </div>
        <div id="badge">—</div>
        <div id="hud"></div>
        <p>
          Priced in WebAssembly by the same Rust the server runs, so the
          optimistic local number and the authoritative one agree bit for bit.
          Dotted cells are the ones the accuracy guard repriced on the lattice.
        </p>
      </div>
    </div>
    <script type="module" src="/apps/canvas-demo/dist/payoff.js"></script>
  </body>
</html>
