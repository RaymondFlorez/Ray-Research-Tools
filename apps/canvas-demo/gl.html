<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picasso WebGL renderer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f5f2; }
      #gl { display: block; touch-action: none; cursor: grab; }
      #gl:active { cursor: grabbing; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre; color: #1c1a17;
        background: rgba(255,255,255,0.88); border: 1px solid #c9c6bf; border-radius: 6px;
        pointer-events: none;
      }
      #help { position: fixed; bottom: 12px; left: 12px;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #6f6a61;
        pointer-events: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@picasso/canvas-core": "/packages/canvas-core/dist/index.js",
          "@picasso/canvas-render": "/packages/canvas-render/dist/index.js",
          "@picasso/canvas-gl": "/packages/canvas-gl/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="help">drag to pan · wheel to zoom · every node is one instance in one draw call</div>
    <script type="module" src="/apps/canvas-demo/dist/gl.js"></script>
  </body>
</html>
