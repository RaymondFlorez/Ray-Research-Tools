# Static app + same-origin /api proxy (nginx). To serve the frontend from a CDN instead,
# see "Frontend on a CDN" in docs/DEPLOYMENT.md.
apiVersion: v1
kind: Service
metadata:
  name: geoglobe-web
spec:
  selector:
    app.kubernetes.io/name: geoglobe-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoglobe-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: geoglobe-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geoglobe-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: geoglobe/web
          env:
            - name: API_UPSTREAM
              value: http://geoglobe-api:8000
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
