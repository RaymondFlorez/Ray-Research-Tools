# Query-result cache shared by API replicas. Cache only: no persistence.
apiVersion: v1
kind: Service
metadata:
  name: geoglobe-redis
spec:
  selector:
    app.kubernetes.io/name: geoglobe-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoglobe-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geoglobe-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geoglobe-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            [
              '--save',
              '',
              '--appendonly',
              'no',
              '--maxmemory',
              '256mb',
              '--maxmemory-policy',
              'allkeys-lru',
            ]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 320Mi }
