# Assumes ingress-nginx and cert-manager; replace the host and issuer for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geoglobe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Long-lived agent WebSockets.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [globe.example.com]
      secretName: geoglobe-tls
  rules:
    - host: globe.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geoglobe-web
                port:
                  name: http
